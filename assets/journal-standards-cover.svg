<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">TQF Journal Brief Professional Standards cover</title>
  <desc id="desc">Formal journal-style cover for the TQF analytical brief on professional standards.</desc>
  <defs>
    <linearGradient id="journalBg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f6f1"/>
      <stop offset="100%" stop-color="#ece3d1"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#journalBg2)"/>
  <rect x="58" y="58" width="784" height="1084" rx="28" fill="#ffffff" stroke="#ddd2bf"/>
  <rect x="102" y="96" width="696" height="18" rx="9" fill="#12395f"/>
  <rect x="102" y="134" width="184" height="8" rx="4" fill="#c39b52"/>
  <text x="102" y="218" fill="#7c705d" font-family="'Segoe UI', Arial, sans-serif" font-size="34" letter-spacing="7">TQF JOURNAL BRIEF</text>
  <text x="102" y="336" fill="#12395f" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700">Professional</text>
  <text x="102" y="418" fill="#12395f" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700">Standards</text>
  <text x="102" y="510" fill="#12395f" font-family="'Segoe UI', Arial, sans-serif" font-size="50" font-weight="600">Governance Review</text>
  <text x="102" y="592" fill="#4e5f74" font-family="'Segoe UI', Arial, sans-serif" font-size="28">A concise reading of association rules, professional</text>
  <text x="102" y="634" fill="#4e5f74" font-family="'Segoe UI', Arial, sans-serif" font-size="28">duties, and the structure supporting academic quality.</text>
  <rect x="102" y="732" width="610" height="246" rx="24" fill="#fbfaf6" stroke="#ddd2bf"/>
  <text x="142" y="800" fill="#12395f" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700">Highlighted themes</text>
  <text x="142" y="860" fill="#3d4e63" font-family="'Segoe UI', Arial, sans-serif" font-size="26">Association rules and institutional responsibilities</text>
  <text x="142" y="904" fill="#3d4e63" font-family="'Segoe UI', Arial, sans-serif" font-size="26">Membership expectations and committee structure</text>
  <text x="142" y="948" fill="#3d4e63" font-family="'Segoe UI', Arial, sans-serif" font-size="26">Professional conduct and continuity of governance</text>
  <text x="102" y="1078" fill="#7c705d" font-family="'Segoe UI', Arial, sans-serif" font-size="30">Thai Association of Quantitative Analysts and Financial Engineers</text>
  <text x="102" y="1120" fill="#12395f" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700">TQF</text>
</svg>
